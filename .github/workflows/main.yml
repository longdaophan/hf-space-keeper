name: Keep HF Space Alive
on:
  schedule:
    # Chạy 1 lần/ngày vào lúc 1h UTC (8h sáng giờ Việt Nam)
    - cron: '0 1 * * *'
  workflow_dispatch:  # Cho phép chạy thủ công
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay trong khung giờ 8h-14h
        run: |
          # Tính số giây từ 0-6 giờ (8h VN - 14h VN = 6 tiếng = 21600 giây)
          RANDOM_DELAY=$((RANDOM % 21600))
          echo "⏰ Đợi $RANDOM_DELAY giây trước khi ping..."
          echo "⏰ Tương đương $(($RANDOM_DELAY / 3600)) giờ $(($RANDOM_DELAY % 3600 / 60)) phút"
          sleep $RANDOM_DELAY
      
      - name: Ping Hugging Face Space
        run: |
          echo "🚀 Bắt đầu đánh thức Space..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
                     -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                     -H "Accept: text/html,application/xhtml+xml" \
                     -H "Accept-Language: vi-VN,vi;q=0.9,en;q=0.8" \
                     --max-time 60 \
                     --retry 2 \
                     https://rick-d-model-server.hf.space)
          
          echo "📡 Response code: $response"
          
          if [ $response -eq 200 ]; then
            echo "✅ Space đã tỉnh và đang chạy!"
          elif [ $response -eq 502 ] || [ $response -eq 503 ]; then
            echo "⏳ Space đang khởi động (502/503)..."
            echo "🔄 Đợi 30 giây rồi thử lại..."
            sleep 30
            response2=$(curl -s -o /dev/null -w "%{http_code}" \
                       -A "Mozilla/5.0" \
                       --max-time 60 \
                       https://rick-d-khoa-luan.hf.space)
            echo "📡 Response code lần 2: $response2"
            if [ $response2 -eq 200 ]; then
              echo "✅ Space đã tỉnh thành công!"
            else
              echo "⚠️ Space vẫn đang khởi động, cần thêm thời gian"
            fi
          else
            echo "⚠️ Space trả về mã $response"
          fi
        continue-on-error: true
      
      - name: Thông báo hoàn thành
        run: |
          echo "✨ Hoàn thành ping vào $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🇻🇳 Tương đương $(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S') giờ Việt Nam"
